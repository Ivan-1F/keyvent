[package]
name = "keyvent"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Global keyboard event stream for macOS, with automatic Accessibility permission lifecycle management"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Ivan-1F/keyvent"
keywords = ["hotkey", "keyboard", "macos", "event-tap", "global"]
categories = ["os::macos-apis", "api-bindings"]
exclude = ["private/"]

[package.metadata.docs.rs]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]

[dependencies]
crossbeam-channel = "0.5"
log = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }
